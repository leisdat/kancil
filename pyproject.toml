[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kancil"
dynamic = ["version"]
description = "Tiny zero-dependency agent browser + DevTools for Termux"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Farul" }]
keywords = ["browser", "automation", "agent", "devtools", "scraper", "termux", "har"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
kancil = "kancil.cli:main"

[project.optional-dependencies]
# Transport HTTP/2 opsional untuk static engine:
#   pip install 'kancil[http2]'
# Tanpa extra ini engine diam-diam memakai urllib (perilaku lama).
http2 = ["httpx[http2]"]

[project.urls]
Homepage = "https://github.com/leisdat/kancil"

[tool.setuptools.dynamic]
version = { attr = "kancil.__version__" }

[tool.setuptools.packages.find]
include = ["kancil*"]
